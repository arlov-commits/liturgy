<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Liturgy booklet — preview</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="css/settings.css">
<link rel="stylesheet" href="css/book.css">
<style>
  @media print { #status { display: none; } }
  /* screen-only chrome for the preview; not part of the book */
  @media screen {
    body { background: #e8e6e1; margin: 0; }
    #status { font: 13px system-ui, sans-serif; padding: 6px 10px; background: #fff; border-bottom: 1px solid #ccc; }
    .pagedjs_pages { display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; }
    .pagedjs_page { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
  }
</style>
</head>
<body>
<div id="status">Loading…</div>
<main id="book"></main>
<script src="js/parse.js"></script>
<script>
// Prototype loader: ?text=<folder of liturgy-text>&book=<name>&engine=paged|none
(async function () {
  const q = new URLSearchParams(location.search);
  const base = (q.get("text") || "../liturgy-text/").replace(/\/?$/, "/");
  const bookName = q.get("book") || "test";
  const engine = q.get("engine") || "paged";
  const status = document.getElementById("status");
  const get = async (p) => { const r = await fetch(base + p); if (!r.ok) throw new Error(p + " " + r.status); return r.text(); };

  const list = (await get(`books/${bookName}.txt`)).split("\n").map((s) => s.trim()).filter((s) => s && !s.startsWith("//"));
  const html = [];
  for (const f of list) html.push(LiturgyParse.parse(await get("text/" + f), f));
  const main = document.getElementById("book");
  main.innerHTML = html.join("\n");
  const problems = main.querySelectorAll(".mismatch").length;
  await document.fonts.ready;

  if (engine === "paged") {
    const src = main.innerHTML; main.innerHTML = "";
    // Paged.js can't read var(--x) inside @page rules, so fill in the values from settings.css first
    const rootStyle = getComputedStyle(document.documentElement);
    const fill = (css) => css.replace(/var\((--[\w-]+)\)/g, (m, name) => rootStyle.getPropertyValue(name).trim() || m);
    const sheets = [];
    for (const l of document.querySelectorAll('link[rel=stylesheet]')) {
      const css = await (await fetch(l.href)).text();
      sheets.push({ [l.href]: l.href.includes("book.css") ? fill(css) : css });
    }
    [...document.querySelectorAll('link[rel=stylesheet]')].forEach((l) => l.remove());
    await new Promise((res) => { const s = document.createElement("script"); s.src = "vendor/paged.min.js"; s.onload = res; document.head.appendChild(s); });
    const flow = await new PagedModule.Previewer().preview(src, sheets, main);
    status.textContent = `${list.length} sections · ${flow.total} pages · ${problems} pinyin problem(s)`;
  } else {
    status.textContent = `${list.length} sections · ${problems} pinyin problem(s) · press Ctrl+P to see pages`;
  }
  document.body.dataset.ready = "1";
})().catch((e) => { document.getElementById("status").textContent = "Error: " + e.message; document.body.dataset.ready = "err"; });
</script>
</body>
</html>
