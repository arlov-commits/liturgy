<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Liturgy booklet — pages</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="css/settings.css">
<link rel="stylesheet" href="css/book.css">
<style>
  @media print { #status { display: none; } }
  /* screen-only chrome for the preview; not part of the book */
  @media screen {
    body { background: #e8e6e1; margin: 0; }
    #status { font: 13px system-ui, sans-serif; padding: 6px 10px; background: #fff; border-bottom: 1px solid #ccc; }
    .embedded #status { display: none; }
    .pagedjs_pages { display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; }
    .pagedjs_page { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
    /* flag lines whose pinyin count doesn't match (kept here: Paged.js drops screen-only rules from book.css) */
    .mismatch { outline: 1.5px solid #d33; }
    .empty { font: 15px system-ui, sans-serif; max-width: 30em; margin: 40px auto; color: #555; }
    .keep.too-long { outline: 1.5px dashed #d33; }
    .pageref-missing { outline: 1.5px solid #d33; }
    .embedded .block { cursor: pointer; }
    .embedded .block:hover { background: rgba(255, 220, 120, .18); }
    .block.here { background: rgba(255, 210, 90, .35); box-shadow: 0 0 0 3px rgba(255, 210, 90, .35); }
    .mismatch::after { content: attr(data-problem); display: block; color: #d33; font: 9px sans-serif; }
  }
</style>
</head>
<body>
<div id="status">Loading…</div>
<main id="book"></main>
<script src="js/parse.js"></script>
<script src="js/source.js"></script>
<script>
// The booklet pages. Inside the editor (index.html) it takes the book from the editor, so unsaved
// changes show; opened on its own it reads the text itself:
//   preview.html?text=<folder of liturgy-text> or ?repo=<owner/name>, &book=<name>&engine=paged|none
(async function () {
  const q = new URLSearchParams(location.search);
  const engine = q.get("engine") || "paged";
  const status = document.getElementById("status");
  const editor = window.parent !== window && window.parent.Editor;
  if (editor) document.documentElement.classList.add("embedded");

  let book;   // { sections: [{ name, text }], css: extra settings (text of a stylesheet) }
  if (editor) {
    book = editor.bookForPreview();
  } else {
    const bookName = q.get("book") || "test";
    const source = await LiturgySource.open(q, bookName);
    book = await LiturgySource.loadBook(source, bookName);
  }

  const main = document.getElementById("book");
  main.innerHTML = book.sections.map((s) => LiturgyParse.parse(s.text, s.name)).join("\n");
  fillContents(main);
  // page references to sections that aren't in this booklet can't be numbered: show "?" and flag them
  for (const a of main.querySelectorAll("a.pageref")) {
    if (!document.getElementById(a.getAttribute("href").slice(1))) {
      a.replaceWith(Object.assign(document.createElement("span"), { className: "pageref-missing", textContent: "?" }));
    }
  }
  const problems = main.querySelectorAll(".mismatch").length + main.querySelectorAll(".pageref-missing").length;
  const extra = document.createElement("style");
  extra.textContent = book.css || "";
  document.head.appendChild(extra);
  await document.fonts.ready;

  const tooLong = fitKeeps(main);

  let pages = 0;
  if (!book.sections.length) {
    // (Paged.js would lay out the whole page instead)
    main.innerHTML = '<p class="empty">This booklet has no sections yet. In the Text tab, open “Booklet contents” and list the section files, or use New section.</p>';
    status.textContent = "No sections";
  } else if (engine === "paged") {
    const src = main.innerHTML; main.innerHTML = "";
    // Paged.js can't read var(--x) inside @page rules, so fill in the values from the settings first
    const rootStyle = getComputedStyle(document.documentElement);
    const fill = (css) => css.replace(/var\((--[\w-]+)\)/g, (m, name) => rootStyle.getPropertyValue(name).trim() || m);
    const sheets = [];
    for (const l of document.querySelectorAll('link[rel=stylesheet]')) {
      const css = await (await fetch(l.href)).text();
      sheets.push({ [l.href]: l.href.includes("book.css") ? fill(css) : css });
    }
    sheets.push({ [location.href.replace(/[?#].*/, "") + "#settings"]: extra.textContent });
    [...document.querySelectorAll('link[rel=stylesheet]')].forEach((l) => l.remove());
    await new Promise((res) => { const s = document.createElement("script"); s.src = "vendor/paged.min.js"; s.onload = res; document.head.appendChild(s); });
    pages = (await new PagedModule.Previewer().preview(src, sheets, main)).total;
    removeOverflow();
    status.textContent = `${book.sections.length} sections · ${pages} pages · ${problems} problem(s)`;
  } else {
    status.textContent = `${book.sections.length} sections · ${problems} problem(s) · press Ctrl+P to see pages`;
  }
  document.body.dataset.ready = "1";
  if (editor) {
    // click a verse → show its line in the editor
    main.addEventListener("click", (ev) => {
      const block = ev.target.closest("[data-line]"), sec = ev.target.closest("[data-file]");
      if (block && sec) editor.jumpTo(sec.dataset.file, +block.dataset.line);
    });
    editor.previewDone(window, { pages, problems, tooLong });
  }
})().catch((e) => {
  document.getElementById("status").textContent = e.needKey ? "Not connected to GitHub — open the editor (index.html) to connect." : "Error: " + e.message;
  document.body.dataset.ready = "err";
  const editor = window.parent !== window && window.parent.Editor;
  if (editor) editor.previewDone(window, { error: e.message });
});
// [contents] → one line per section of the booklet (except the one holding the list): name ..... page
function fillContents(main) {
  for (const nav of main.querySelectorAll("nav.toc")) {
    const own = nav.closest("section");
    for (const sec of main.querySelectorAll("section[data-toc]")) {
      if (sec === own) continue;
      const row = document.createElement("div");
      row.className = "toc-entry";
      row.append(Object.assign(document.createElement("span"), { className: "toc-title", textContent: sec.dataset.toc }),
        Object.assign(document.createElement("span"), { className: "toc-dots" }),
        Object.assign(document.createElement("a"), { className: "toc-page", href: "#" + sec.id }));
      nav.append(row);
    }
  }
}

// Paged.js can leave an invisible copy of a moved block in a page's overflow (off to the side of the page).
// Take those out so clicks and "show this line" only ever find the copy you can see.
function removeOverflow() {
  for (const page of document.querySelectorAll(".pagedjs_page")) {
    const edge = page.getBoundingClientRect().right;
    for (const el of page.querySelectorAll(".pagedjs_page_content [data-ref]")) {
      if (el.isConnected && el.getBoundingClientRect().left >= edge) el.remove();
    }
  }
}

// [one page] groups taller than a page's text area are shrunk (CSS zoom) until they fit
function fitKeeps(main) {
  const keeps = main.querySelectorAll(".keep");
  if (!keeps.length) return;
  const probe = document.createElement("div");
  probe.style.cssText = "position:absolute; visibility:hidden; width:calc(var(--page-width) - var(--margin-binding) - var(--margin-outside));" +
    "height:calc(var(--page-height) - var(--margin-top) - var(--margin-bottom))";
  document.body.append(probe);
  const { width, height } = probe.getBoundingClientRect();
  probe.remove();
  const smallest = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--fit-smallest")) || 0.7;
  const old = main.style.cssText;
  main.style.cssText = `width:${width}px; position:absolute; visibility:hidden`;
  let tooLong = 0;
  for (const k of keeps) {
    const h = k.getBoundingClientRect().height;
    if (h <= height) continue;
    const zoom = Math.floor((height / h) * 0.98 * 1000) / 1000;
    if (zoom >= smallest) k.style.zoom = zoom;
    else { k.classList.add("too-long"); tooLong++; }   // can't fit readably: let it run over pages
  }
  main.style.cssText = old;
  return tooLong;
}

// The editor calls this to bring the verse at a text line into view (a split verse: its first part)
function showLine(file, line) {
  const sec = [...document.querySelectorAll("[data-file]")].filter((s) => s.dataset.file === file);
  let best = null;
  for (const b of sec.flatMap((s) => [...s.querySelectorAll("[data-line]")])) if (+b.dataset.line <= line && (!best || +b.dataset.line > +best.dataset.line)) best = b;
  document.querySelectorAll(".block.here").forEach((b) => b.classList.remove("here"));
  if (!best) return;
  document.querySelectorAll(`[data-file="${CSS.escape(file)}"] [data-line="${best.dataset.line}"]`).forEach((b) => b.classList.add("here"));
  const r = best.getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) best.scrollIntoView({ block: "center" });
}
</script>
</body>
</html>
