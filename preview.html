<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Liturgy booklet — pages</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="fonts/extra/extra.css">
<link rel="stylesheet" href="css/settings.css">
<link rel="stylesheet" href="css/book.css">
<style>
  @media print { #status { display: none; } }
  /* Letter sheets (printSheets): the pages copied 2 × 2 onto letter paper, in the order of js/impose.js.
     The #sheets rules outrank Paged.js's own print rules, which assume one booklet page per sheet. */
  #sheets { display: none; }
  html.print-sheets .pagedjs_pages { display: none !important; }
  html.print-sheets #sheets { display: block; }
  #sheets .sheet { width: 8.5in; height: 11in; display: grid; grid-template: 5.5in 5.5in / 4.25in 4.25in; overflow: hidden; break-after: page; }
  #sheets .slot { position: relative; overflow: hidden; }
  #sheets .pagedjs_page { margin: 0 !important; box-shadow: none !important; border: 0 !important; transform-origin: top left;
    height: var(--pagedjs-height) !important; min-height: 0 !important; max-height: none !important; break-after: auto !important; }
  #sheets .pagedjs_sheet { height: var(--pagedjs-height) !important; min-height: 0 !important; max-height: none !important; }
  /* screen-only chrome for the preview; not part of the book */
  @media screen {
    body { background: #e8e6e1; margin: 0; }
    #status { font: 13px system-ui, sans-serif; padding: 6px 10px; background: #fff; border-bottom: 1px solid #ccc; }
    .embedded #status { display: none; }
    .pagedjs_pages { display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; }
    .pagedjs_page { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
    /* flag lines whose pinyin count doesn't match (kept here: Paged.js drops screen-only rules from book.css) */
    .mismatch { outline: 1.5px solid #d33; }
    .empty { font: 15px system-ui, sans-serif; max-width: 30em; margin: 40px auto; color: #555; }
    /* facing pages: page 1 on its own on the right, then 2|3, 4|5 … as in the open book */
    .pagedjs_pages { display: grid; grid-template-columns: repeat(2, max-content); justify-content: center; column-gap: 0; row-gap: 16px; }
    .pagedjs_page:first-child { grid-column: 2; }
    .pagedjs_left_page { box-shadow: -1px 1px 4px rgba(0,0,0,.25); }
    .pagedjs_right_page { box-shadow: 1px 1px 4px rgba(0,0,0,.25); border-left: 1px solid #ddd; }
    .pagedjs_blank_page .pagedjs_area::after { content: "blank page"; display: block; margin-top: 45%; text-align: center; color: #bbb; font: italic 11px system-ui, sans-serif; }
    @media (max-width: 860px) { .pagedjs_pages { grid-template-columns: max-content; } .pagedjs_page:first-child { grid-column: 1; } }
    .pageref-missing { outline: 1.5px solid #d33; }
    .embedded .block { cursor: pointer; }
    .embedded .block:hover { background: rgba(255, 220, 120, .18); }
    .block.here { background: rgba(255, 210, 90, .35); box-shadow: 0 0 0 3px rgba(255, 210, 90, .35); }
    #jumping { position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%); z-index: 10; background: #fff; padding: 12px 18px;
      border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.25); font: 14px system-ui, sans-serif; display: flex; align-items: center; gap: 10px; }
    #jumping[hidden] { display: none; }
    #jumping .spin { width: 18px; height: 18px; border: 3px solid #e3d6b8; border-top-color: #8a5a00; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .mismatch::after { content: attr(data-problem); display: block; color: #d33; font: 9px sans-serif; }
  }
</style>
</head>
<body>
<div id="status">Loading…</div>
<div id="jumping" hidden><span class="spin"></span> Laying out the pages…</div>
<main id="book"></main>
<script src="js/parse.js"></script>
<script src="js/source.js"></script>
<script src="js/impose.js"></script>
<script>
// The booklet pages. Inside the editor (index.html) it takes the book from the editor, so unsaved
// changes show; opened on its own it reads the text itself:
//   preview.html?text=<folder of liturgy-text> or ?repo=<owner/name>, &book=<name>&engine=paged|none
// The editor keeps two of these pages and lays the book out again in the hidden one (rerender) while the
// other is on show: fonts stay loaded between layouts, which makes each redraw much quicker.
const q = new URLSearchParams(location.search);
const engine = q.get("engine") || "paged";
const status = document.getElementById("status");
const editor = window.parent !== window && window.parent.Editor;
if (editor) document.documentElement.classList.add("embedded");
const main = document.getElementById("book");
let bookCss = null;       // the book's own stylesheets (settings.css, book.css) as text, read once
let previewer = null;     // the Paged.js run on show (or still going)
let running = null, runId = 0;
let standaloneBook = null;

// Lay the book out (again). A newer call stops an older one that's still going.
function rerender() {
  const id = ++runId;
  if (previewer) previewer.chunker.stop();
  const previous = running;
  running = (async () => {
    if (previous) await previous.catch(() => {});
    if (id === runId) await render(id);
  })().catch((e) => {
    status.textContent = e.needKey ? "Not connected to GitHub — open the editor (index.html) to connect." : "Error: " + e.message;
    document.body.dataset.ready = "err";
    if (editor) editor.previewDone(window, { error: e.message });
  });
  return running;
}

async function render(id) {
  const timing = [["start", performance.now()]];
  window.previewTiming = timing;   // [step, ms] — for checking the preview's speed
  let book;   // { sections: [{ name, text }], css: extra settings (text of a stylesheet), plan }
  if (editor) book = editor.bookForPreview();
  else {
    if (!standaloneBook) {
      const bookName = q.get("book") || "test";
      standaloneBook = await LiturgySource.loadBook(await LiturgySource.open(q, bookName), bookName);
    }
    book = standaloneBook;
  }

  // start from a clean page: take away the last layout and the styles Paged.js added for it
  if (previewer) { previewer.polisher.destroy(); previewer = null; }
  document.getElementById("sheets")?.remove();
  delete document.body.dataset.ready;
  if (!bookCss) {
    const links = [...document.querySelectorAll('link[rel=stylesheet]')].filter((l) => !l.href.includes("/fonts/"));
    bookCss = await Promise.all(links.map(async (l) => ({ href: l.href, text: await (await fetch(l.href)).text() })));
    links.forEach((l) => l.remove());
  }
  // while measuring ([keep together] spans) the book's own styles apply as they are
  const raw = bookCss.map((c) => document.head.appendChild(Object.assign(document.createElement("style"), { textContent: c.text })));
  // the editor's changed settings go after the defaults (moved to the end each time, as the defaults were just re-added)
  const extra = document.getElementById("settings-extra") || Object.assign(document.createElement("style"), { id: "settings-extra" });
  extra.textContent = book.css || "";
  document.head.appendChild(extra);

  main.innerHTML = book.sections.map((s) => LiturgyParse.parse(s.text, s.name)).join("\n");
  const order = getComputedStyle(document.documentElement).getPropertyValue("--verse-order").trim();
  if (order) main.querySelectorAll("section").forEach((sec) => sec.classList.add("order-" + order));
  fillContents(main);
  // page references to sections that aren't in this booklet can't be numbered: show "?" and flag them
  for (const a of main.querySelectorAll("a.pageref")) {
    if (!document.getElementById(a.getAttribute("href").slice(1))) {
      a.replaceWith(Object.assign(document.createElement("span"), { className: "pageref-missing", textContent: "?" }));
    }
  }
  const problems = main.querySelectorAll(".mismatch").length + main.querySelectorAll(".pageref-missing").length;
  await document.fonts.ready;
  timing.push(["fonts", performance.now()]);
  planKeeps(main, book.plan || {});

  let pages = 0;
  if (!book.sections.length) {
    // (Paged.js would lay out the whole page instead)
    main.innerHTML = '<p class="empty">This booklet has no chapters yet. In the Booklet tab, add a chapter or make a new one.</p>';
    raw.forEach((st) => st.remove());
    status.textContent = "No chapters";
  } else if (engine === "paged") {
    const src = main.innerHTML; main.innerHTML = "";
    // Paged.js can't read var(--x) inside @page rules, so fill in the values from the settings first
    const rootStyle = getComputedStyle(document.documentElement);
    const fill = (css) => css.replace(/var\((--[\w-]+)\)/g, (m, name) => rootStyle.getPropertyValue(name).trim() || m);
    const sheets = bookCss.map((c) => ({ [c.href]: c.href.includes("book.css") ? fill(c.text) : c.text }));
    sheets.push({ [location.href.replace(/[?#].*/, "") + "#page-numbers"]: fill(pageNumberCss(rootStyle)) });
    sheets.push({ [location.href.replace(/[?#].*/, "") + "#settings"]: extra.textContent });
    raw.forEach((st) => st.remove());
    if (typeof PagedModule === "undefined") {
      await new Promise((res) => { const s = document.createElement("script"); s.src = "vendor/paged.min.js"; s.onload = res; document.head.appendChild(s); });
    }
    if (id !== runId) return;
    previewer = new PagedModule.Previewer();
    // Paged.js waits for the next screen frame (~16 ms) before each page, and not at all while the tab is in
    // the background. Go on at once instead (still yielding between pages, so typing stays smooth).
    const next = new MessageChannel(), waiting = [];
    next.port1.onmessage = () => waiting.shift()();
    previewer.chunker.q.tick = (fn) => { waiting.push(fn); next.port2.postMessage(0); };
    // Show this version as soon as the pages in view are done (the rest goes on being laid out below)
    const showAt = editor ? editor.pagesNeeded() : Infinity;
    let shown = false;
    previewer.chunker.on("renderedPage", () => {
      if (!shown && id === runId && previewer.chunker.total >= showAt) shown = editor.previewEarly(window);
      checkWanted(false);
    });
    pages = (await previewer.preview(src, sheets, main)).total;
    if (id !== runId) return;   // stopped: a newer layout takes over
    timing.push(["layout", performance.now()]);
    removeOverflow();
    status.textContent = `${book.sections.length} chapters · ${pages} pages · ${problems} problem(s)`;
  } else {
    raw.forEach((st) => st.remove());
    status.textContent = `${book.sections.length} chapters · ${problems} problem(s) · press Ctrl+P to see pages`;
  }
  document.body.dataset.ready = "1";
  checkWanted(true);
  if (editor) editor.previewDone(window, { pages, problems, spreads: engine === "paged" && pages ? spreadReport() : [],
    blanks: document.querySelectorAll(".pagedjs_blank_page").length });
}

// Page numbers where the settings say: outside / inside corner or centred, at the top or bottom.
// Right-hand (odd) pages are bound on the left, so their outside is the right; left-hand pages the opposite.
function pageNumberCss(rootStyle) {
  const where = rootStyle.getPropertyValue("--page-number-position").trim() || "outside";
  const edge = rootStyle.getPropertyValue("--page-number-edge").trim() === "top" ? "top" : "bottom";
  const look = 'font-family: var(--page-number-font), "Liturgy Extra", serif; font-size: var(--page-number-size);';
  const boxes = ["top-left", "top-center", "top-right", "bottom-left", "bottom-center", "bottom-right"];
  const side = (page) => where === "center" ? "center" : (where === "outside") === (page === "right") ? "right" : "left";
  const rules = ["right", "left"].map((page) => `@page :${page} {\n` + boxes.map((b) =>
    `  @${b} { ${b === `${edge}-${side(page)}` ? `content: counter(page); ${look}` : "content: none;"} }`).join("\n") + "\n}");
  rules.push("@page :blank {\n" + boxes.map((b) => `  @${b} { content: none; }`).join("\n") + "\n}");
  return rules.join("\n");
}

// The editor stops a layout that's no longer wanted (a newer version is on its way)
function stopLayout() {
  runId++;
  if (previewer) previewer.chunker.stop();
}
// Pages from 1 up to the last one (partly) in view — for the editor to know what it needs first
function pagesInView() {
  const pages = [...document.querySelectorAll(".pagedjs_pages > .pagedjs_page")];
  let last = 0;
  pages.forEach((p, i) => { if (p.getBoundingClientRect().top < innerHeight) last = i + 1; });
  return last;
}

// click a verse → show its line in the editor
if (editor) main.addEventListener("click", (ev) => {
  const block = ev.target.closest("[data-line]"), sec = ev.target.closest("[data-file]");
  if (block && sec) editor.jumpTo(sec.dataset.file, +block.dataset.line);
});
rerender();

// [contents] → one line per chapter of the booklet (except the one holding the list), plus any extra entries
// ([toc: …] partway through a chapter), in book order: name ..... page
function fillContents(main) {
  for (const nav of main.querySelectorAll("nav.toc")) {
    const own = nav.closest("section");
    for (const el of main.querySelectorAll("section[data-toc], [data-toc-entry]")) {
      if (el.closest("section") === own) continue;
      const row = document.createElement("div");
      row.className = "toc-entry" + (el.dataset.tocEntry ? " toc-sub" : "");
      row.append(Object.assign(document.createElement("span"), { className: "toc-title", textContent: el.dataset.toc || el.dataset.tocEntry }),
        Object.assign(document.createElement("span"), { className: "toc-dots" }),
        Object.assign(document.createElement("a"), { className: "toc-page", href: "#" + el.id }));
      nav.append(row);
    }
  }
}

// Paged.js can leave an invisible copy of a moved block in a page's overflow (off to the side of the page).
// Take those out so clicks and "show this line" only ever find the copy you can see.
function removeOverflow() {
  for (const page of document.querySelectorAll(".pagedjs_page")) {
    const edge = page.getBoundingClientRect().right;
    for (const el of page.querySelectorAll(".pagedjs_page_content [data-ref]")) {
      if (el.isConnected && el.getBoundingClientRect().left >= edge) el.remove();
    }
  }
}

// [keep together] spans, measured before pagination:
//  - fits a page → stays whole, shrunk a little if needed (never below the "fit smallest" setting);
//  - longer → a "spread": starts on a new page and runs over as few pages as it needs (shrunk a little when
//    that saves a page). An even number of pages must start on a left-hand page ("facing") so they face in pairs;
//    Paged.js adds a blank page before it when needed. An odd number may start on either side.
// plan (from the editor, after a first try): pages = actual page counts by span, flip = chapters to start on
// the other side (so the blank page goes at the end of the chapter before), hard = chapters where that failed.
function planKeeps(main, plan) {
  const keeps = main.querySelectorAll(".keep");
  if (!keeps.length) return;
  const probe = document.createElement("div");
  probe.style.cssText = "position:absolute; visibility:hidden; width:calc(var(--page-width) - var(--margin-binding) - var(--margin-outside));" +
    "height:calc(var(--page-height) - var(--margin-top) - var(--margin-bottom))";
  document.body.append(probe);
  const { width, height } = probe.getBoundingClientRect();
  probe.remove();
  const root = getComputedStyle(document.documentElement);
  const smallest = parseFloat(root.getPropertyValue("--fit-smallest")) || 0.7;
  const chapterEnd = root.getPropertyValue("--blank-page").trim() === "chapter-end";
  const fill = 0.93;   // blocks never split, so a page is rarely filled to the last line
  const old = main.style.cssText;
  main.style.cssText = `width:${width}px; position:absolute; visibility:hidden`;
  for (const [file, side] of Object.entries(plan.flip || {})) {
    const sec = main.querySelector(`section[data-file="${CSS.escape(file)}"]`);
    if (sec) sec.classList.add("start-" + side);
  }
  for (const k of keeps) {
    const h = k.getBoundingClientRect().height;
    if (h <= height) continue;
    if (h * smallest <= height) {
      // shrunk to fill a page: it needs a page of its own (Paged.js would rather split it than move it).
      // Text doesn't shrink exactly in proportion, so measure again until it really fits.
      let zoom = Math.floor((height / h) * 0.98 * 1000) / 1000;
      k.style.zoom = zoom;
      while (k.getBoundingClientRect().height > height * 0.98 && zoom - 0.01 >= smallest) k.style.zoom = zoom = +(zoom - 0.01).toFixed(3);
      if (k.getBoundingClientRect().height <= height * 0.98) { k.classList.add("whole-page"); continue; }
      k.style.zoom = "";   // can't fit readably after all: treat it as a spread
    }
    const h1 = k.getBoundingClientRect().height;
    let pages = Math.ceil(h1 / (height * fill));
    const shrunk = Math.ceil((h1 * smallest) / (height * fill));
    if (shrunk < pages) { pages = shrunk; k.style.zoom = Math.max(smallest, Math.floor(((pages * height * fill) / h1) * 1000) / 1000); }
    const file = k.closest("section").dataset.file, key = file + ":" + k.dataset.line;
    pages = (plan.pages || {})[key] || pages;
    k.classList.add("spread");
    k.dataset.pages = pages;
    k.dataset.key = key;
    const soft = chapterEnd && (plan.flip || {})[file] && !(plan.hard || []).includes(file);
    if (pages % 2 === 0 && !soft) k.classList.add("facing");
  }
  main.style.cssText = old;
}

// Where each spread actually landed (after Paged.js), for the editor to check and improve
function spreadReport() {
  const pages = [...document.querySelectorAll(".pagedjs_page")];
  const pageOf = (el) => el.closest(".pagedjs_page");
  const out = [];
  for (const key of new Set([...document.querySelectorAll(".keep.spread")].map((k) => k.dataset.key))) {
    const parts = [...document.querySelectorAll(".keep.spread")].filter((k) => k.dataset.key === key);
    const on = [...new Set(parts.map(pageOf))];
    const first = on[0], file = key.slice(0, key.lastIndexOf(":"));
    const chapterFirst = pageOf(document.querySelector(`section[data-file="${CSS.escape(file)}"]`));
    out.push({
      key, file, planned: +parts[0].dataset.pages, actual: on.length,
      left: first.classList.contains("pagedjs_left_page"),
      blankBefore: !!first.previousElementSibling && first.previousElementSibling.classList.contains("pagedjs_blank_page"),
      chapterStartsLeft: chapterFirst.classList.contains("pagedjs_left_page"),
      page: pages.indexOf(first) + 1,
    });
  }
  return out;
}

// Print on letter sheets, 4 pages a side (see js/impose.js for the order). Each copied page keeps its own
// page number (Paged.js counts pages in the order they appear, so it's set on each copy).
function buildSheets() {
  document.getElementById("sheets")?.remove();
  const pages = [...document.querySelectorAll(".pagedjs_pages > .pagedjs_page")];
  const box = Object.assign(document.createElement("div"), { id: "sheets" });
  const inch = 96, first = pages[0] && pages[0].getBoundingClientRect();
  const scale = first ? Math.min(1, (4.25 * inch) / first.width, (5.5 * inch) / first.height) : 1;   // other page sizes: shrink to fit
  for (const sheet of LiturgyImpose.layout(pages.length)) {
    for (const side of [sheet.front, sheet.back]) {
      const el = Object.assign(document.createElement("div"), { className: "sheet" });
      for (const n of side) {
        const slot = Object.assign(document.createElement("div"), { className: "slot" });
        if (n) {
          const copy = pages[n - 1].cloneNode(true);
          copy.removeAttribute("id");
          copy.style.counterReset = `page ${n - 1}`;
          if (scale < 1) copy.style.transform = `scale(${scale})`;
          slot.append(copy);
        }
        el.append(slot);
      }
      box.append(el);
    }
  }
  document.body.append(box);
  return LiturgyImpose.layout(pages.length).length;
}
function printSheets() {
  buildSheets();
  const size = Object.assign(document.createElement("style"), { textContent: "@page { size: 8.5in 11in; margin: 0; }" });
  document.head.append(size);
  document.documentElement.classList.add("print-sheets");
  addEventListener("afterprint", () => { size.remove(); document.documentElement.classList.remove("print-sheets"); }, { once: true });
  print();
}

// The editor calls this to bring the verse at a text line into view (a split verse: its first part)
function showLine(file, line) {
  const sec = [...document.querySelectorAll("[data-file]")].filter((s) => s.dataset.file === file);
  let best = null;
  const blocks = sec.flatMap((s) => [...s.querySelectorAll(".block[data-line]")]);
  for (const b of blocks) if (+b.dataset.line <= line && (!best || +b.dataset.line > +best.dataset.line)) best = b;
  best = best || blocks[0];   // (a line above the chapter's first verse: that verse)
  document.querySelectorAll(".block.here").forEach((b) => b.classList.remove("here"));
  if (!best) return;
  document.querySelectorAll(`[data-file="${CSS.escape(file)}"] .block[data-line="${best.dataset.line}"]`).forEach((b) => b.classList.add("here"));
  const r = best.getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) { quietUntil = Date.now() + 800; best.scrollIntoView({ block: "center" }); }
}

// The editor's contents list: show the page a chapter starts on, at the top. A chapter not laid out yet (the
// pages are still coming): show a spinner and go there as soon as it is.
let wanted = null;
function showChapter(file) {
  wanted = file;
  return checkWanted(document.body.dataset.ready === "1");
}
// (also called as each page is laid out, and when all are). While pages are still coming, the chapter's first page
// may be the last one so far, which can't be scrolled to the top yet: keep at it until it can.
function checkWanted(done) {
  if (!wanted) return true;
  const start = [...document.querySelectorAll(".pagedjs_page [data-file]")].find((s) => s.dataset.file === wanted);
  let there = false;
  if (start) {
    const page = start.closest(".pagedjs_page");
    quietUntil = Date.now() + 800;
    page.scrollIntoView({ block: "start" });
    there = Math.abs(page.getBoundingClientRect().top) < 2;
  }
  if (there || done) wanted = null;
  document.getElementById("jumping").hidden = !wanted;
  return !!start;
}

// Scrolling the pages by hand tells the editor which verse is at the top, to mark that place in its contents list
// (not when the editor itself scrolled them to the verse being edited)
let quietUntil = 0, scrollTimer = null;
if (editor) addEventListener("scroll", () => {
  if (scrollTimer) return;
  scrollTimer = setTimeout(() => {
    scrollTimer = null;
    if (Date.now() < quietUntil || !editor.previewScrolled) return;
    for (const b of document.querySelectorAll(".pagedjs_page .block[data-line]")) {
      if (b.getBoundingClientRect().bottom < 30) continue;
      const sec = b.closest("[data-file]");
      if (sec) editor.previewScrolled(window, sec.dataset.file, +b.dataset.line);
      return;
    }
  }, 150);
}, { passive: true });
</script>
</body>
</html>
